<!doctype html><html><head><meta charset='utf-8'><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:900px;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#0f172a;background:#fff}
.wrap{width:900px;padding:36px 40px}
.h{font-size:26px;font-weight:700;letter-spacing:1px}
.sub{font-size:15px;color:#64748b;margin-top:6px}
.blue{color:#2563eb}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.tag{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:#eff6ff;color:#1d4ed8;margin:3px 4px 0 0}
.mono{font-family:Consolas,"Cascadia Mono",monospace}
</style></head><body>
<div class="wrap" style="height:400px;background:#f8fafc">
 <div class="h">同一张表，不同的人看到不同的数据</div>
 <div class="sub">按用户组配置，在数据库连接器层统一强制执行</div>
 <div style="display:flex;gap:14px;margin-top:22px">
  <div class="card" style="flex:1;padding:16px;border-top:4px solid #ef4444">
     <div style="font-weight:700;font-size:16px">🚫 列策略</div><div style="font-size:12.5px;color:#64748b;margin:6px 0 12px;line-height:1.6;height:40px">禁止读取指定字段，任何位置引用（含 SELECT *）都拒绝</div>
     <table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr><td style="border:1px solid #e2e8f0;padding:5px 6px">姓名</td><td style="border:1px solid #e2e8f0;padding:5px 6px">城市</td><td style="background:#fee2e2;border:1px solid #e2e8f0;padding:5px 6px;color:#b91c1c">身份证 ✕</td></tr><tr><td style="border:1px solid #e2e8f0;padding:5px 6px">张三</td><td style="border:1px solid #e2e8f0;padding:5px 6px">杭州</td><td style="background:#fee2e2;border:1px solid #e2e8f0;padding:5px 6px">—</td></tr><tr><td style="border:1px solid #e2e8f0;padding:5px 6px">李四</td><td style="border:1px solid #e2e8f0;padding:5px 6px">广州</td><td style="background:#fee2e2;border:1px solid #e2e8f0;padding:5px 6px">—</td></tr></table></div>
  <div class="card" style="flex:1;padding:16px;border-top:4px solid #2563eb">
     <div style="font-weight:700;font-size:16px">🔍 行策略</div><div style="font-size:12.5px;color:#64748b;margin:6px 0 12px;line-height:1.6;height:40px">把表改写为带过滤条件的子查询，只返回有权看到的行</div>
     <table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr><td style="border:1px solid #e2e8f0;padding:5px 6px">订单</td><td style="border:1px solid #e2e8f0;padding:5px 6px">大区</td><td style="border:1px solid #e2e8f0;padding:5px 6px">金额</td></tr><tr><td style="border:1px solid #e2e8f0;padding:5px 6px">#1001</td><td style="border:1px solid #e2e8f0;padding:5px 6px">华东</td><td style="border:1px solid #e2e8f0;padding:5px 6px">¥320</td></tr><tr><td style="border:1px solid #e2e8f0;padding:5px 6px">#1004</td><td style="border:1px solid #e2e8f0;padding:5px 6px">华东</td><td style="border:1px solid #e2e8f0;padding:5px 6px">¥158</td></tr></table></div>
  <div class="card" style="flex:1;padding:16px;border-top:4px solid #f59e0b">
     <div style="font-weight:700;font-size:16px">🎭 脱敏策略</div><div style="font-size:12.5px;color:#64748b;margin:6px 0 12px;line-height:1.6;height:40px">查询、分组、过滤、关联中都只能看到脱敏后的值</div>
     <table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr><td style="border:1px solid #e2e8f0;padding:5px 6px">用户</td><td style="border:1px solid #e2e8f0;padding:5px 6px">手机号</td></tr><tr><td style="border:1px solid #e2e8f0;padding:5px 6px">张三</td><td style="border:1px solid #e2e8f0;padding:5px 6px">138****5678</td></tr><tr><td style="border:1px solid #e2e8f0;padding:5px 6px">李四</td><td style="border:1px solid #e2e8f0;padding:5px 6px">139****0021</td></tr></table></div>
 </div>
 <div style="display:flex;gap:10px;margin-top:20px;font-size:13px;color:#334155;justify-content:center">
  <span class="tag">👥 用户组</span><span class="tag">📝 权限申请与审批</span><span class="tag">📜 访问审计</span><span class="tag">🔒 无法判定安全的 SQL 一律拒绝</span>
 </div>
</div>
</body></html>
